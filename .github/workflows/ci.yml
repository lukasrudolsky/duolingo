name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://duolingo:duolingo_ci_password@localhost:5432/duolingo_ci"
  REDIS_URL: "redis://localhost:6379"
  AUTH_SECRET: "ci-only-secret-not-used-in-production"

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duolingo
          POSTGRES_PASSWORD: duolingo_ci_password
          POSTGRES_DB: duolingo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U duolingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed (tracks + Phase 1 demo lesson, needed by e2e/lesson.spec.ts)
        run: pnpm db:seed

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
