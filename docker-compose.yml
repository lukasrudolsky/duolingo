services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: duolingo
      POSTGRES_PASSWORD: duolingo_dev_password
      POSTGRES_DB: duolingo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duolingo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Not wired into the app yet (no audio/image uploads before Phase 5/9), but the local dev
  # story is set up from Phase 0 so those phases don't need new infra decisions.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: duolingo
      MINIO_ROOT_PASSWORD: duolingo_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
